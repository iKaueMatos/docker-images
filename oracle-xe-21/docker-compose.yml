version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - 1521:1521
      - 8080:8080
    environment:
      - ORACLE_PASSWORD=MyStrongPassword123
      - APP_USER=myuser
      - APP_USER_PASSWORD=MyUserPassword123
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data: